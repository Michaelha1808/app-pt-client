name: Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/caloeye-backend

jobs:
  # ── Job 1: Build image và push lên Docker Hub ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cần full history + tags cho `git describe`

      - name: Resolve version from git tag
        id: ver
        run: echo "version=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: SSH vào VPS, pull image mới, restart qua PM2 ──────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    env:
      APP_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 180s
          envs: APP_VERSION
          script: |
            set -e
            cd /var/www/app
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "→ Pulling latest code (config, nginx, compose file)..."
            git pull origin main

            echo "→ Pulling new Docker image..."
            docker pull ${{ env.IMAGE }}:latest

            echo "→ Restarting via PM2..."
            pm2 restart caloeye

            # Đợi container backend sẵn sàng nhận lệnh artisan (tối đa ~60s).
            echo "→ Waiting for backend to be ready..."
            for i in $(seq 1 12); do
              if $COMPOSE exec -T backend php artisan --version >/dev/null 2>&1; then break; fi
              sleep 5
            done

            echo "→ Cleaning up old images..."
            docker image prune -f

            # Thông báo bản cập nhật tới toàn bộ user (best-effort — không chặn deploy).
            # Command tự chống gửi trùng theo version; lỗi ở đây sẽ tự thử lại lần deploy sau.
            if [ -n "$APP_VERSION" ]; then
              echo "→ Announcing update $APP_VERSION to all users..."
              $COMPOSE exec -T backend php artisan notify:announce-update "$APP_VERSION" || echo "⚠ announce-update failed — bỏ qua"
            else
              echo "→ Không có git tag → bỏ qua thông báo cập nhật"
            fi

            echo "✓ Deploy complete — $(date)"
