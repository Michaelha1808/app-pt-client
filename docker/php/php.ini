upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 128M
max_execution_time = 120
output_buffering = Off
implicit_flush = On

; Không có dòng này thì PHP mặc định UTC (container không có TZ/tzdata),
; trong khi config('app.timezone') = Asia/Ho_Chi_Minh — khiến today()/now() thường
; (không truyền timezone) lệch ngày so với now(config('app.timezone')) vào khung giờ
; 00:00-07:00 giờ VN mỗi ngày, gây kế hoạch/nhiệm vụ lưu 1 ngày rồi không khớp lúc đọc lại.
date.timezone = Asia/Ho_Chi_Minh
